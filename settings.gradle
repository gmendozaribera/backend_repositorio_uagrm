rootProject.name = 'repositorio-backend'

// Módulos compartidos
include 'dao', 'dto', 'imp', 'spec', 'mockup'
project(':dao').projectDir    = file('source/dao')
project(':dto').projectDir    = file('source/dto')
project(':imp').projectDir    = file('source/imp')
project(':spec').projectDir   = file('source/spec')
project(':mockup').projectDir = file('source/mockup')

// Microservicios (se agregan por Sprint)
include 'auth-service'
project(':auth-service').projectDir = file('source/ws/auth-service')

include 'catalog-service'
project(':catalog-service').projectDir = file('source/ws/catalog-service')

include 'user-service'
project(':user-service').projectDir = file('source/ws/user-service')

include 'work-service'
project(':work-service').projectDir = file('source/ws/work-service')

include 'plagiarism-service'
project(':plagiarism-service').projectDir = file('source/ws/plagiarism-service')
