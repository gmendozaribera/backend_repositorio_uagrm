// Servicios, validadores, jobs Quartz, servicios Redis, seguridad compartida y manejo global de errores
dependencies {
    api project(':dao')
    api project(':dto')
    api 'org.springframework.boot:spring-boot-starter-webmvc'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    api 'org.springframework.boot:spring-boot-starter-data-redis'
    api "dev.samstevens.totp:totp:${totpVersion}"
    // Importacion del padron estudiantil: CSV y Excel (.xlsx con poi-ooxml, .xls con poi)
    implementation "org.apache.commons:commons-csv:${commonsCsvVersion}"
    implementation "org.apache.poi:poi-ooxml:${poiVersion}"

    // Correo saliente (prueba SMTP y notificaciones futuras). Sin spring.mail.* no se autoconfigura ningun sender:
    // CorreoService arma el suyo con los parametros de SMTP_GROUP de la tabla dominio.
    api 'org.springframework.boot:spring-boot-starter-mail'

    testImplementation project(':mockup')
    // Servidor SMTP falso en memoria para probar CorreoService
    testImplementation "com.icegreen:greenmail:${greenmailVersion}"
}
