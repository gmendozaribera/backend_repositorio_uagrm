# Todos los valores sensibles o dependientes del entorno se sobreescriben con variables
# de entorno (docker-compose / ConfigMap y Secret de Kubernetes).
# Para desarrollo local: SPRING_PROFILES_ACTIVE=dev (ver application-dev.yml).
server:
  port: ${SERVER_PORT:8083}
  # Cabeceras de hasta 8 KB (default de Tomcat, explicito): un JWT ocupa ~0.5 KB. Mas grande -> 400.
  max-http-request-header-size: 8KB
  # Errores que no pasan por GlobalExceptionHandler (p. ej. el /error del contenedor): nunca trazas, mensajes de
  # excepciones ni detalles de binding. Los ProblemDetail propios ya llevan un detail pensado para el usuario.
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  application:
    name: user-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/repositorio}
    username: ${DB_USERNAME:repositorio}
    password: ${DB_PASSWORD:repositorio}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # el esquema lo maneja exclusivamente Flyway

  # Las migraciones las aplica SOLO auth-service (este modulo no incluye Flyway).
  # user-service debe arrancar despues de que auth-service migro la BD.

  # Importacion del padron: archivo de hasta 5 MB (el request lleva ademas la cabecera multipart)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Tiempos cortos: la verificacion de sesion responde 503 rapido si Redis cae
      timeout: 2s
      connect-timeout: 2s

  mvc:
    problemdetails:
      enabled: true

  # Scheduler de la purga diaria de notificaciones: en memoria (sin tablas QRTZ_*). Con varias replicas cada una
  # corre su copia del job, que es idempotente.
  quartz:
    job-store-type: memory

app:
  # Swagger UI con el contrato de spec (imp SwaggerUiConfig). Apagado salvo SWAGGER_UI_ENABLED=true; en dev, true.
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}
    contrato: user-api.yaml
  # Mismos valores que auth-service: este servicio valida los tokens que emite auth-service
  # (misma clave HS256 y mismo emisor) y cierra sesiones con la misma revocacion de Redis.
  seguridad:
    jwt:
      secreto: ${JWT_SECRET}             # obligatorio: el MISMO secreto que auth-service. Nunca en el repo.
      emisor: repositorio-uagrm
      refresh-ttl: 7d                    # TTL de auth:revocado-desde:{idUsuario} al cerrar sesiones
    dos-factores:
      emisor: Repositorio UAGRM
      ttl-pendiente: 300s
      max-intentos: 5
    cors-origenes: ${CORS_ORIGENES:http://localhost:4200}   # mismos origenes en los 5 servicios
    # HSTS (Strict-Transport-Security). Apagado: en produccion lo pone el Ingress con TLS. Ver imp CabecerasSeguridad.
    hsts-enabled: ${SEGURIDAD_HSTS_ENABLED:false}

  # Tabla de dominio: /api/v1/dominios borra la cache config:dominio:{GRUPO} en cada escritura
  dominio:
    cache:
      ttl: ${DOMINIO_CACHE_TTL:600s}
    # Llave AES-256 de los parametros secretos (SMTP_GROUP.PASSWORD): Base64 de 32 bytes (openssl rand -base64 32).
    # Obligatoria: sin ella el servicio no arranca. Nunca en el repo (Secret de Kubernetes). Si se cambia, los
    # secretos ya guardados dejan de poder descifrarse y hay que volver a cargarlos.
    cifrado-key: ${DOMINIO_CIFRADO_KEY}

  notificaciones:
    cache:
      ttl: ${NOTIF_CACHE_TTL:1d}          # contador notif:pendientes:{idUsuario}; se renueva al escribir
    purga:
      cron: ${NOTIF_PURGA_CRON:0 0 3 * * ?}   # Quartz: todos los dias a las 03:00
      zona: ${NOTIF_PURGA_ZONA:America/La_Paz}

# Actuator: SOLO health (y sus grupos liveness/readiness para Kubernetes). Sin detalles ni componentes: un anonimo
# solo ve {"status":"UP"} (no versiones, ni la BD, ni Redis, ni MinIO).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true   # /actuator/health/liveness y /readiness para Kubernetes
