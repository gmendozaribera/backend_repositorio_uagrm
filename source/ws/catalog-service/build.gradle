plugins {
    id 'org.springframework.boot'
}

description = 'catalog-service :8082 — facultades, carreras, materias, semestres, grupos, fases, tipos de trabajo'

dependencies {
    implementation project(':imp')
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Swagger UI con el CONTRATO (spec/openapi), apagado por defecto: ver imp SwaggerUiConfig
    runtimeOnly project(':spec')
    runtimeOnly "org.webjars:swagger-ui:${swaggerUiVersion}"
    // Sin Flyway a proposito: las migraciones (source/dao) las aplica solo auth-service.
    // Este servicio arranca con ddl-auto=validate sobre el esquema ya migrado.
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation project(':mockup')
    // Tests de contrato: cada request/response se valida contra spec/openapi/catalog-api.yaml
    testImplementation project(':spec')
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation "com.atlassian.oai:openapi-request-validator-mockmvc:${openapiValidatorVersion}"
    // Integracion con PostgreSQL y Redis reales (base ContenedoresIntegracion de mockup): el esquema de las
    // migraciones reales, con Flyway solo en tests (en ejecucion las aplica auth-service)
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway'
    testImplementation 'org.flywaydb:flyway-database-postgresql'
}

// Solo el jar ejecutable (evita el -plain.jar en build/libs)
tasks.named('jar') {
    enabled = false
}
