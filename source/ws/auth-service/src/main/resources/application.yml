# Todos los valores sensibles o dependientes del entorno se sobreescriben con variables
# de entorno (docker-compose / ConfigMap y Secret de Kubernetes).
# Para desarrollo local: SPRING_PROFILES_ACTIVE=dev (ver application-dev.yml).
server:
  port: ${SERVER_PORT:8081}
  # Cabeceras de hasta 8 KB (default de Tomcat, explicito): un JWT ocupa ~0.5 KB. Mas grande -> 400.
  max-http-request-header-size: 8KB
  # Errores que no pasan por GlobalExceptionHandler (p. ej. el /error del contenedor): nunca trazas, mensajes de
  # excepciones ni detalles de binding. Los ProblemDetail propios ya llevan un detail pensado para el usuario.
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
  # Detras de nginx: Tomcat (RemoteIpValve) toma la IP real del cliente de X-Forwarded-For, pero SOLO si el request
  # llega desde una IP interna/privada (10.x, 172.16-31.x, 192.168.x, 127.x, ::1...). Un cliente externo no puede
  # falsificar su IP enviando la cabecera. La usa el limite de intentos fallidos (auth:rate:*:{ip}).
  forward-headers-strategy: native

spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/repositorio}
    username: ${DB_USERNAME:repositorio}
    password: ${DB_PASSWORD:repositorio}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # el esquema lo maneja exclusivamente Flyway

  # auth-service es el dueno de las migraciones en Sprint 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Una BD que ya recibio el seed del perfil demo (R__ de db/demo) debe poder arrancar sin ese perfil: un
    # repetible aplicado que no esta en las locations no es error. Las versionadas siguen validandose completas.
    ignore-migration-patterns: "*:future,repeatable:missing"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Tiempos cortos: si Redis cae, responder 503 rapido en vez de colgar el request
      timeout: 2s
      connect-timeout: 2s

  mvc:
    problemdetails:
      enabled: true

app:
  # Swagger UI con el contrato de spec (imp SwaggerUiConfig). Apagado salvo SWAGGER_UI_ENABLED=true; en dev, true.
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}
    contrato: auth-api.yaml
  seguridad:
    jwt:
      secreto: ${JWT_SECRET}             # obligatorio: Base64, minimo 32 bytes. Nunca en el repo.
      emisor: repositorio-uagrm
      refresh-ttl: 7d
    dos-factores:
      emisor: Repositorio UAGRM
      ttl-pendiente: 300s
      max-intentos: 5
    cors-origenes: ${CORS_ORIGENES:http://localhost:4200}   # mismos origenes en los 5 servicios
    # HSTS (Strict-Transport-Security). Apagado: en produccion lo pone el Ingress con TLS. Ver imp CabecerasSeguridad.
    hsts-enabled: ${SEGURIDAD_HSTS_ENABLED:false}
    # Llave AES-256 del secreto TOTP (usuario.totp_secret). OBLIGATORIA: Base64 de 32 bytes (openssl rand -base64 32).
    # Solo auth-service la recibe. Nunca en el repo (el valor de dev esta en application-dev.yml).
    totp-cifrado-key: ${TOTP_CIFRADO_KEY:}

  # Tabla de dominio (LOGIN_INTENTOS, LOGIN_WAITING...): HASH config:dominio:{GRUPO}
  dominio:
    cache:
      ttl: ${DOMINIO_CACHE_TTL:600s}

  # El auto-registro crea la notificacion BIENVENIDA: contador notif:pendientes:{idUsuario} (mismo TTL que user-service)
  notificaciones:
    cache:
      ttl: ${NOTIF_CACHE_TTL:1d}

  # Configuracion por facultad (jwtExpiracionHoras): JSON config:facultad:{idFacultad}, compartida con catalog-service
  config-facultad:
    cache:
      ttl: ${CONFIG_FACULTAD_CACHE_TTL:600s}

  admin-inicial:
    habilitado: ${ADMIN_INICIAL_HABILITADO:false}
    usuario: ${ADMIN_INICIAL_USUARIO:admin}
    password: ${ADMIN_INICIAL_PASSWORD:}
    correo: ${ADMIN_INICIAL_CORREO:admin@uagrm.edu.bo}
    ci: ${ADMIN_INICIAL_CI:1}

# Actuator: SOLO health (y sus grupos liveness/readiness para Kubernetes). Sin detalles ni componentes: un anonimo
# solo ve {"status":"UP"} (no versiones, ni la BD, ni Redis, ni MinIO).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true   # /actuator/health/liveness y /readiness para Kubernetes
