plugins {
    id 'org.springframework.boot'
}

description = 'auth-service :8081 — JWT, 2FA TOTP, refresh, logout, auto-registro'

dependencies {
    implementation project(':imp')
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation project(':mockup')
    // Tests de contrato: cada request/response se valida contra spec/openapi/auth-api.yaml
    testImplementation project(':spec')
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation "com.atlassian.oai:openapi-request-validator-mockmvc:${openapiValidatorVersion}"
}

// Solo el jar ejecutable (evita el -plain.jar en build/libs)
tasks.named('jar') {
    enabled = false
}
