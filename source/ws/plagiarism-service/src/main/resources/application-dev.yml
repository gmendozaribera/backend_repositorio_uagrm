# Solo para desarrollo local. Valores alineados con docker-compose/dev/.env.example.
spring:
  data:
    redis:
      password: ${REDIS_PASSWORD:redis_dev_password}

app:
  seguridad:
    jwt:
      # Secreto SOLO de desarrollo, el mismo que application-dev.yml de auth-service.
      secreto: ${JWT_SECRET:ZGV2LXNvbG8tcGFyYS1kZXNhcnJvbGxvLWNhbWJpYXItZW4tcHJvZHVjY2lvbiE=}
  almacenamiento:
    # MinIO del docker-compose de desarrollo. Credenciales SOLO de desarrollo.
    url: ${MINIO_URL:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  plagio:
    # En desarrollo el motor por defecto es el simulado (sin red ni creditos de Copyleaks)
    motor: ${PLAGIO_MOTOR:SIMULADO}
    copyleaks:
      sandbox: ${COPYLEAKS_SANDBOX:true}
