    put:
      tags: [Carreras]
      operationId: actualizarCarrera
      summary: Actualizar carrera (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarreraRequest'
      responses:
        '200':
          description: Carrera actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaCarrera'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
    delete:
      tags: [Carreras]
