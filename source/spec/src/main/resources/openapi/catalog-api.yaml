      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SemestreRequest'
      responses:
        '201':
          description: Semestre creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaSemestre'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

  /api/v1/semestres/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [Semestres]
      operationId: actualizarSemestre
      summary: Actualizar semestre (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SemestreRequest'
      responses:
        '200':
          description: Semestre actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaSemestre'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
