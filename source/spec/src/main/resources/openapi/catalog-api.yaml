                $ref: '#/components/schemas/RespuestaListaMaterias'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
    post:
      tags: [Materias]
      operationId: crearMateria
      summary: Crear materia (ADMIN)
      description: La sigla es unica dentro de la facultad.
      requestBody:
        required: true
        content:
