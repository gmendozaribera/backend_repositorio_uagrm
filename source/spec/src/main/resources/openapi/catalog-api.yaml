openapi: 3.0.3
info:
  title: Repositorio Digital UAGRM - catalog-service
  version: 1.3.0
  description: |
    Catalogos academicos por facultad: facultades, carreras, materias, semestres, grupos (con sus docentes),
    fases y tipos de trabajo.

    **Contrato fuente de verdad.** El backend lo verifica con tests de contrato
    (`CatalogContratoTest`) y el frontend genera su cliente TypeScript desde este archivo.
    Todo cambio pasa por aqui primero; los cambios incompatibles requieren subir la version mayor.

    Reglas generales:
    - **Lecturas (GET):** cualquier usuario autenticado (ADMIN, DOCENTE, ESTUDIANTE). Los listados de
      facultades, carreras, materias, semestres, grupos, fases y tipos de trabajo tambien se pueden consultar
      **sin iniciar sesion** (solo lectura; los usa el repositorio publico para sus filtros). Los docentes de un
      grupo y la configuracion de una facultad siguen exigiendo sesion.
    - **Escrituras (POST, PUT, DELETE):** solo ADMIN.
    - **Sin borrado fisico:** `DELETE` desactiva (`estado = 0`) y devuelve el registro desactivado.
      Para reactivar se envia `estado: 1` en el `PUT`.
    - **Listados:** por defecto solo registros activos; `incluirInactivos=true` devuelve todos
      (pensado para las pantallas de administracion). Los listados no se paginan (catalogos chicos).
    - **`estado` en los requests es opcional:** en `POST` por defecto es 1 (activo); en `PUT`, si no se
      envia, se conserva el valor actual.
    - **Normalizacion:** las siglas se guardan sin espacios y en MAYUSCULAS (`inf ` -> `INF`); los nombres sin
      espacios al inicio/fin. El `DELETE` de un docente de grupo (`/grupos/{id}/docentes/{idUsuario}`) si es fisico.
    - Los listados de facultades, carreras, materias, semestres, fases y tipos de trabajo se sirven desde
      cache (hasta 10 minutos); toda escritura invalida la cache de esa entidad al instante.

    Formato de respuestas:
    - Exito: `{ data, message, status, timestamp }`
    - Error: `ProblemDetail` (RFC 7807) con `timestamp`; en validaciones incluye `errores` (campo -> mensaje).
  contact:
    name: Equipo Repositorio Digital FICCT
  license:
    name: Uso academico UAGRM
    url: https://www.uagrm.edu.bo
servers:
  - url: http://localhost:8082
    description: Desarrollo local
tags:
  - name: Facultades
    description: Facultades de la universidad (raiz de todos los catalogos)
  - name: ConfigFacultad
    description: Parametros propios de cada facultad (archivos, plagio, calificacion, acceso externo, sesion)
  - name: Carreras
    description: Carreras de cada facultad
  - name: Materias
    description: Materias ofrecidas por cada facultad
  - name: Semestres
    description: Periodos academicos (numero de periodo + anio) de cada facultad
  - name: Grupos
    description: Grupos de una materia en un semestre y los docentes asignados a cada grupo
  - name: Fases
    description: Fases de entrega de un trabajo (perfil, avance, final...) definidas por cada facultad
  - name: TiposTrabajo
    description: Tipos de trabajo (proyecto, tesis, monografia...) definidos por cada facultad

paths:
  # ---------------------------------------------------------------- Facultades
  /api/v1/facultades:
    get:
      tags: [Facultades]
      operationId: listarFacultades
      security:
        - {}
        - bearerAuth: []
      summary: Listar facultades
      parameters:
        - $ref: '#/components/parameters/IncluirInactivos'
      responses:
        '200':
          description: Facultades ordenadas por nombre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaListaFacultades'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
    post:
      tags: [Facultades]
      operationId: crearFacultad
      summary: Crear facultad (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacultadRequest'
      responses:
        '201':
          description: Facultad creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaFacultad'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

  /api/v1/facultades/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [Facultades]
      operationId: actualizarFacultad
      summary: Actualizar facultad (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacultadRequest'
      responses:
        '200':
          description: Facultad actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaFacultad'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
    delete:
      tags: [Facultades]
      operationId: desactivarFacultad
      summary: Desactivar facultad (ADMIN)
      description: Borrado logico (`estado = 0`). Sus carreras, materias, etc. no se desactivan en cascada.
      responses:
        '200':
          description: Facultad desactivada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaFacultad'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

  /api/v1/facultades/{id}/config:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [ConfigFacultad]
      operationId: obtenerConfigFacultad
      summary: Obtener la configuracion de la facultad
      description: |
        Cualquier usuario autenticado (el frontend la usa, p. ej., para validar el tamano de archivo).
        Si la facultad aun no tiene configuracion propia devuelve los valores por defecto del sistema
        (parametros del grupo `FACULTAD_DEFAULT_GROUP` de la tabla de dominio) con `personalizada = false`.
        Se sirve desde cache (hasta 10 minutos); el `PUT` la invalida al instante.
      responses:
        '200':
          description: Configuracion vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaConfigFacultad'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
    put:
      tags: [ConfigFacultad]
      operationId: actualizarConfigFacultad
      summary: Guardar la configuracion de la facultad (ADMIN)
      description: |
        Crea o reemplaza la configuracion propia de la facultad (`personalizada` pasa a true).
        Los cambios se aplican al instante en todos los modulos de esa facultad; `jwtExpiracionHoras`
        afecta a las sesiones que se inicien desde ese momento. `umbralPlagioMedio` debe ser menor que
        `umbralPlagioAlto` (400).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigFacultadRequest'
      responses:
        '200':
          description: Configuracion guardada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaConfigFacultad'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

  # ---------------------------------------------------------------- Carreras
  /api/v1/carreras:
    get:
      tags: [Carreras]
      operationId: listarCarreras
      security:
        - {}
        - bearerAuth: []
      summary: Listar carreras
      parameters:
