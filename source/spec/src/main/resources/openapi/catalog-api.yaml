        '200':
          description: Semestres del mas reciente al mas antiguo (anio y periodo descendentes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaListaSemestres'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
