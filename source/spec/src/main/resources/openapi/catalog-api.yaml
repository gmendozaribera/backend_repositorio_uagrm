          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaListaDocentesGrupo'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
    post:
      tags: [Grupos]
      operationId: asignarDocenteGrupo
      summary: Asignar docente al grupo (ADMIN)
      description: |
        El usuario debe existir, estar activo y tener rol DOCENTE. Con `esAdminCurso = true` el docente
        es Administrador de Curso de ese grupo (puede serlo de varios grupos a la vez).
        Si el docente ya esta asignado devuelve 409; para cambiar `esAdminCurso` se usa el PATCH de la asignacion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignarDocenteRequest'
      responses:
        '201':
          description: Docente asignado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaDocenteGrupo'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

  /api/v1/grupos/{id}/docentes/{idUsuario}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: idUsuario
        in: path
        required: true
        description: Id del usuario docente.
        schema:
          type: integer
          format: int32
          minimum: 1
    delete:
      tags: [Grupos]
      operationId: quitarDocenteGrupo
      summary: Quitar docente del grupo (ADMIN)
      description: Elimina la asignacion (es una relacion, no un catalogo, por eso el borrado es fisico).
      responses:
        '200':
          $ref: '#/components/responses/SinDatos'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
    patch:
      tags: [Grupos]
      operationId: actualizarDocenteGrupo
      summary: Cambiar si el docente es Administrador de Curso del grupo (ADMIN)
      description: Solo modifica `esAdminCurso` de una asignacion existente; 404 si el docente no esta asignado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarDocenteGrupoRequest'
      responses:
        '200':
          description: Asignacion actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaDocenteGrupo'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

