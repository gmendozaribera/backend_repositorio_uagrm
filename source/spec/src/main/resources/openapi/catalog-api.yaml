      tags: [Grupos]
      operationId: desactivarGrupo
      summary: Desactivar grupo (ADMIN)
      description: Borrado logico. Las asignaciones de docentes se conservan.
      responses:
        '200':
          description: Grupo desactivado
          content:
            application/json:
              schema:
