  # ---------------------------------------------------------------- Grupos
  /api/v1/grupos:
    get:
      tags: [Grupos]
      operationId: listarGrupos
      security:
        - {}
        - bearerAuth: []
      summary: Listar grupos
      description: Los filtros se combinan (facultad Y materia Y semestre). Este listado no se cachea.
      parameters:
        - name: idFacultad
          in: query
          required: false
          description: Solo los grupos cuya materia pertenece a esta facultad.
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: idMateria
          in: query
          required: false
          description: Solo los grupos de esta materia.
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: idSemestre
          in: query
          required: false
          description: Solo los grupos de este semestre.
          schema:
            type: integer
            format: int32
            minimum: 1
        - $ref: '#/components/parameters/IncluirInactivos'
      responses:
        '200':
          description: Grupos ordenados por nombre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaListaGrupos'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
    post:
      tags: [Grupos]
      operationId: crearGrupo
      summary: Crear grupo (ADMIN)
      description: |
        La materia y el semestre deben ser de la misma facultad. El nombre es unico por materia + semestre.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrupoRequest'
      responses:
        '201':
          description: Grupo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaGrupo'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

  /api/v1/grupos/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [Grupos]
      operationId: actualizarGrupo
      summary: Actualizar grupo (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrupoRequest'
      responses:
        '200':
          description: Grupo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaGrupo'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
