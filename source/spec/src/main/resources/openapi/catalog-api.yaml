security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token emitido por auth-service (login, 2fa/verify, refresh o password/change).

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Id del registro.
      schema:
        type: integer
        format: int32
        minimum: 1
    IdFacultadFiltro:
      name: idFacultad
      in: query
      required: false
      description: Solo los registros de esta facultad. Sin el filtro se listan los de todas las facultades.
      schema:
        type: integer
        format: int32
        minimum: 1
    IncluirInactivos:
      name: incluirInactivos
      in: query
      required: false
      description: Si es true tambien devuelve los registros desactivados (pantallas de administracion).
      schema:
        type: boolean
        default: false

  responses:
    SinDatos:
      description: Operacion realizada (data es null)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaSinDatos'
    DatosInvalidos:
      description: Cuerpo o parametros invalidos, o regla de negocio incumplida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            status: 400
            title: Datos invalidos
            detail: Uno o mas campos no son validos.
            instance: /api/v1/carreras
            timestamp: '2026-11-12T14:00:00Z'
            errores:
              sigla: no debe estar vacio
    NoAutenticado:
      description: Token ausente, invalido, expirado o sesion cerrada
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            status: 401
            title: No autenticado
            detail: Token ausente, invalido o expirado.
            instance: /api/v1/carreras
            timestamp: '2026-11-12T14:00:00Z'
    AccesoDenegado:
      description: Rol sin permiso (las escrituras son solo ADMIN) o contrasena pendiente de cambio
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            status: 403
            title: Acceso denegado
            detail: No tiene permisos para realizar esta accion.
            instance: /api/v1/carreras
            timestamp: '2026-11-12T14:00:00Z'
    NoEncontrado:
      description: El registro indicado (o uno referenciado en el cuerpo) no existe
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            status: 404
            title: Recurso no encontrado
            detail: No existe la facultad 99.
            instance: /api/v1/carreras
            timestamp: '2026-11-12T14:00:00Z'
    Conflicto:
      description: Duplicado (sigla, nombre, semestre, asignacion) o referencia a un registro inactivo
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            status: 409
            title: Conflicto
            detail: Ya existe una carrera con la sigla INF.
            instance: /api/v1/carreras
            timestamp: '2026-11-12T14:00:00Z'
    ServicioNoDisponible:
      description: |
        No se pudo verificar la sesion (Redis no responde); por seguridad se rechaza la operacion.
        La cache de catalogos, en cambio, no provoca 503: si falla se consulta directo la base de datos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    # ---------- Comunes ----------
    Estado:
      type: integer
      format: int32
      enum: [0, 1]
      description: 1 = activo, 0 = inactivo (desactivado).
      example: 1
    EstadoOpcional:
      type: integer
      format: int32
      enum: [0, 1]
      description: Opcional (omitir el campo, no enviar null). En POST por defecto 1; en PUT, si no se envia, se conserva el valor actual.
      example: 1
    Id:
      type: integer
      format: int32
      minimum: 1
      example: 1

    # ---------- Requests ----------
    FacultadRequest:
      type: object
      required: [nombre, sigla]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
          example: Facultad de Ingenieria en Ciencias de la Computacion y Telecomunicaciones
        sigla:
          type: string
          minLength: 1
          maxLength: 20
          example: FICCT
        estado:
          $ref: '#/components/schemas/EstadoOpcional'
    CarreraRequest:
      type: object
      required: [nombre, sigla, idFacultad]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
          example: Ingenieria Informatica
        sigla:
          type: string
          minLength: 1
          maxLength: 20
          example: INF
        idFacultad:
          $ref: '#/components/schemas/Id'
        estado:
          $ref: '#/components/schemas/EstadoOpcional'
    MateriaRequest:
      type: object
      required: [nombre, sigla, idFacultad]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
          example: Ingenieria de Software I
        sigla:
          type: string
          minLength: 1
          maxLength: 20
          example: INF412
        idFacultad:
          $ref: '#/components/schemas/Id'
        estado:
          $ref: '#/components/schemas/EstadoOpcional'
    SemestreRequest:
      type: object
      required: [semestre, anio, idFacultad]
      properties:
        semestre:
          type: integer
          format: int32
          minimum: 1
          maximum: 4
          description: Numero de periodo dentro del anio (1 y 2 regulares; 3 y 4 para periodos especiales).
          example: 2
        anio:
          type: integer
          format: int32
          minimum: 2000
          maximum: 2100
          example: 2026
        idFacultad:
          $ref: '#/components/schemas/Id'
        estado:
          $ref: '#/components/schemas/EstadoOpcional'
    GrupoRequest:
      type: object
      required: [nombre, idMateria, idSemestre]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 20
          example: SA
        idMateria:
          $ref: '#/components/schemas/Id'
        idSemestre:
          $ref: '#/components/schemas/Id'
        estado:
          $ref: '#/components/schemas/EstadoOpcional'
    ConfigFacultadRequest:
      type: object
      required: [tamanoMaxArchivoMB, umbralPlagioMedio, umbralPlagioAlto, comparacionInternet, accesoExterno, escalaCalifMax, jwtExpiracionHoras]
      properties:
        tamanoMaxArchivoMB:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Tamano maximo por archivo en MB (los videos subidos directamente tienen un limite fijo de 100 MB).
          example: 10
        umbralPlagioMedio:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: Porcentaje de similitud desde el que el riesgo es medio (amarillo).
          example: 30
        umbralPlagioAlto:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: Porcentaje de similitud desde el que el riesgo es alto (rojo). Debe ser mayor que umbralPlagioMedio.
          example: 50
        comparacionInternet:
          type: boolean
          description: Si el analisis de plagio compara tambien con fuentes de internet.
          example: false
        accesoExterno:
          type: boolean
          description: Si usuarios anonimos pueden ver los metadatos de los trabajos evaluados.
          example: false
        escalaCalifMax:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          description: Calificacion maxima (la escala va de 0 a este valor).
          example: 100
        jwtExpiracionHoras:
          type: integer
          format: int32
          minimum: 1
          maximum: 24
          description: Horas de vida del access token de los usuarios de esta facultad.
          example: 1
    AsignarDocenteRequest:
      type: object
      required: [idUsuario, esAdminCurso]
      properties:
        idUsuario:
          $ref: '#/components/schemas/Id'
        esAdminCurso:
          type: boolean
          description: true si el docente sera Administrador de Curso de este grupo.
          example: false
    ActualizarDocenteGrupoRequest:
      type: object
      required: [esAdminCurso]
      properties:
        esAdminCurso:
          type: boolean
          description: true si el docente pasa a ser Administrador de Curso de este grupo.
          example: true
    FaseRequest:
      type: object
      required: [nombre, idFacultad]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
          example: Perfil
        descripcion:
          type: string
          nullable: true
          maxLength: 255
          example: Propuesta inicial del trabajo
        idFacultad:
          $ref: '#/components/schemas/Id'
        estado:
          $ref: '#/components/schemas/EstadoOpcional'
    TipoTrabajoRequest:
      type: object
      required: [nombre, idFacultad]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
          example: Proyecto de grado
        idFacultad:
          $ref: '#/components/schemas/Id'
        estado:
          $ref: '#/components/schemas/EstadoOpcional'

    # ---------- Datos ----------
    Facultad:
      type: object
      required: [idFacultad, nombre, sigla, estado]
      properties:
        idFacultad:
          $ref: '#/components/schemas/Id'
        nombre:
          type: string
          example: Facultad de Ingenieria en Ciencias de la Computacion y Telecomunicaciones
        sigla:
          type: string
          example: FICCT
        estado:
          $ref: '#/components/schemas/Estado'
    ConfigFacultad:
      type: object
      required: [idFacultad, personalizada, tamanoMaxArchivoMB, umbralPlagioMedio, umbralPlagioAlto, comparacionInternet, accesoExterno, escalaCalifMax, jwtExpiracionHoras]
      properties:
        idFacultad:
          $ref: '#/components/schemas/Id'
        personalizada:
          type: boolean
          description: false si la facultad usa los valores por defecto del sistema (aun no se guardo su configuracion).
          example: true
        tamanoMaxArchivoMB:
          type: integer
          format: int32
          example: 10
        umbralPlagioMedio:
          type: integer
          format: int32
          example: 30
        umbralPlagioAlto:
          type: integer
          format: int32
          example: 50
        comparacionInternet:
          type: boolean
          example: false
        accesoExterno:
          type: boolean
          example: false
        escalaCalifMax:
          type: integer
          format: int32
          example: 100
        jwtExpiracionHoras:
          type: integer
          format: int32
          example: 1
    Carrera:
      type: object
      required: [idCarrera, nombre, sigla, idFacultad, estado]
      properties:
        idCarrera:
          $ref: '#/components/schemas/Id'
        nombre:
          type: string
          example: Ingenieria Informatica
        sigla:
          type: string
          example: INF
        idFacultad:
          $ref: '#/components/schemas/Id'
        estado:
          $ref: '#/components/schemas/Estado'
    Materia:
      type: object
      required: [idMateria, nombre, sigla, idFacultad, estado]
      properties:
        idMateria:
          $ref: '#/components/schemas/Id'
        nombre:
          type: string
          example: Ingenieria de Software I
        sigla:
          type: string
          example: INF412
        idFacultad:
          $ref: '#/components/schemas/Id'
        estado:
          $ref: '#/components/schemas/Estado'
    Semestre:
      type: object
      required: [idSemestre, semestre, anio, idFacultad, estado]
      properties:
        idSemestre:
          $ref: '#/components/schemas/Id'
        semestre:
          type: integer
          format: int32
          example: 2
        anio:
          type: integer
          format: int32
          example: 2026
        idFacultad:
          $ref: '#/components/schemas/Id'
        estado:
          $ref: '#/components/schemas/Estado'
    Grupo:
      type: object
      required: [idGrupo, nombre, idMateria, idSemestre, estado]
      properties:
        idGrupo:
          $ref: '#/components/schemas/Id'
        nombre:
          type: string
          example: SA
        idMateria:
          $ref: '#/components/schemas/Id'
        idSemestre:
          $ref: '#/components/schemas/Id'
        estado:
          $ref: '#/components/schemas/Estado'
    DocenteGrupo:
      type: object
      required: [idGrupo, idUsuario, usuario, nombre, apellidos, esAdminCurso]
      properties:
        idGrupo:
          $ref: '#/components/schemas/Id'
        idUsuario:
          $ref: '#/components/schemas/Id'
        usuario:
          type: string
          example: doc.maria
        nombre:
          type: string
          example: Maria
        apellidos:
          type: string
          example: Lopez Suarez
        esAdminCurso:
          type: boolean
          example: true
    Fase:
      type: object
      required: [idFase, nombre, descripcion, idFacultad, estado]
      properties:
        idFase:
          $ref: '#/components/schemas/Id'
        nombre:
          type: string
          example: Perfil
        descripcion:
          type: string
          nullable: true
          example: Propuesta inicial del trabajo
        idFacultad:
          $ref: '#/components/schemas/Id'
        estado:
          $ref: '#/components/schemas/Estado'
    TipoTrabajo:
      type: object
      required: [idTipoTrabajo, nombre, idFacultad, estado]
      properties:
        idTipoTrabajo:
          $ref: '#/components/schemas/Id'
        nombre:
          type: string
          example: Proyecto de grado
        idFacultad:
          $ref: '#/components/schemas/Id'
        estado:
          $ref: '#/components/schemas/Estado'

    # ---------- Envoltorios ApiResponse<T> ----------
    # OpenAPI 3.0 no tiene genericos: un esquema plano por cada tipo de data.
    RespuestaFacultad:
      type: object
      required: [data, message, status, timestamp]
      properties:
        data:
          $ref: '#/components/schemas/Facultad'
        message:
          type: string
        status:
          type: integer
