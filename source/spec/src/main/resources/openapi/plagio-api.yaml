openapi: 3.0.3
info:
  title: Repositorio Digital UAGRM - plagiarism-service
  version: 1.0.0
  description: |
    Deteccion de plagio de los documentos de un trabajo, de forma asincrona.

    **Contrato fuente de verdad.** El backend lo verifica con tests de contrato
    (`PlagioContratoTest`) y el frontend genera su cliente TypeScript desde este archivo.
    Todo cambio pasa por aqui primero; los cambios incompatibles requieren subir la version mayor.

    **Como funciona**
    1. Un docente del grupo inicia el analisis (`POST`). Se analizan los archivos PDF, DOCX y ODT del trabajo.
    2. El analisis corre en segundo plano con el motor configurado (`SIMULADO` en desarrollo, `COPYLEAKS` en
       produccion). Mientras tanto el frontend consulta `GET .../estado` (pensado para cada 5 segundos; no toca la
       base de datos mientras el estado este en cache).
    3. Al terminar se guarda el resultado y se notifica al docente que lo inicio.
    - Fuentes: el repositorio interno siempre (todos los trabajos enviados, salvo borradores y el propio);
      internet solo si `ConfigFacultad.comparacionInternet = true`. De una fuente interna no publicada solo se
      informa el porcentaje (sin titulo ni id).
    - Semaforo segun los umbrales de la facultad: `OK` (verde) < `umbralPlagioMedio` <= `MEDIO` (amarillo)
      < `umbralPlagioAlto` <= `ALTO` (rojo).
    - Un solo analisis en curso por trabajo (409). Un analisis que no termina en el tiempo maximo del sistema
      pasa a `ERROR`.

    **Quien ve y hace que:** iniciar y ver resultados: docentes asignados al grupo del trabajo y ADMIN. Los
    estudiantes no ven los resultados. Para cualquier otro usuario el trabajo "no existe" (404).

    Formato de respuestas:
    - Exito: `{ data, message, status, timestamp }`
    - Error: `ProblemDetail` (RFC 7807) con `timestamp`; en validaciones incluye `errores` (campo -> mensaje).
  contact:
    name: Equipo Repositorio Digital FICCT
  license:
    name: Uso academico UAGRM
    url: https://www.uagrm.edu.bo
servers:
  - url: http://localhost:8085
    description: Desarrollo local
tags:
  - name: Plagio
    description: Analisis de similitud de los documentos de un trabajo
  - name: Webhook
    description: Avisos del proveedor externo (Copyleaks); no los usa el frontend

paths:
  /api/v1/plagio/trabajos/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Plagio]
      operationId: iniciarAnalisisPlagio
      summary: Iniciar un analisis de plagio (docente del grupo)
      description: |
        El trabajo debe estar en `PENDIENTE`, `EN_REVISION`, `APROBADO`, `APROBADO_CON_OBSERVACIONES` o `EVALUADO`
        (409 en `BORRADOR` o `RECHAZADO`) y tener al menos un archivo analizable (400). 409 si ya hay un analisis
        en curso. Responde 202 con el analisis en estado `EN_PROCESO`.
      responses:
        '202':
          description: Analisis iniciado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaAnalisis'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
    get:
      tags: [Plagio]
      operationId: obtenerUltimoAnalisisPlagio
      summary: Ultimo analisis del trabajo (docente del grupo o ADMIN)
      description: El mas reciente (en curso o terminado). 404 si el trabajo nunca se analizo.
      responses:
        '200':
          description: Analisis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaAnalisis'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

  /api/v1/plagio/trabajos/{id}/estado:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Plagio]
      operationId: obtenerEstadoAnalisisPlagio
      summary: Estado del analisis en curso (para consultar periodicamente)
      description: |
        Liviano: el estado del analisis se responde desde cache (los permisos se verifican siempre). Cuando `estado` pasa a `COMPLETADO`
        o `ERROR`, pedir el resultado completo con `GET /api/v1/plagio/trabajos/{id}`.
        404 si el trabajo nunca se analizo.
      responses:
        '200':
          description: Estado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaEstadoAnalisis'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

  /api/v1/plagio/trabajos/{id}/historial:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Plagio]
      operationId: listarAnalisisPlagio
      summary: Todos los analisis del trabajo, del mas reciente al mas antiguo
      responses:
        '200':
          description: Analisis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaListaAnalisis'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

  /api/v1/plagio/webhook/copyleaks/{token}/{evento}/{scanId}:
    parameters:
      - name: token
        in: path
        required: true
        description: Token secreto del webhook (variable de entorno). Si no coincide responde 404.
        schema:
          type: string
          minLength: 32
      - name: evento
        in: path
        required: true
        schema:
          type: string
          enum: [completed, error, creditsChecked, creditschecked, indexed]
      - name: scanId
        in: path
        required: true
        schema:
          type: string
          maxLength: 100
    post:
      tags: [Webhook]
      operationId: recibirWebhookCopyleaks
      summary: Aviso de Copyleaks al terminar un analisis (solo motor COPYLEAKS)
      description: |
        Lo llama Copyleaks, no el frontend. Sin token de sesion; se autentica con el token secreto de la URL
        (comparado en tiempo constante). El cuerpo es el JSON que define Copyleaks. Idempotente.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/SinDatos'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '404':
          $ref: '#/components/responses/NoEncontrado'

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token emitido por auth-service.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Id del trabajo.
      schema:
        type: integer
        format: int32
        minimum: 1

  responses:
    SinDatos:
      description: Operacion realizada (data es null)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaSinDatos'
    DatosInvalidos:
      description: Parametros invalidos o el trabajo no tiene archivos analizables
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NoAutenticado:
      description: Token ausente, invalido, expirado o sesion cerrada
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    AccesoDenegado:
      description: El rol no permite la accion (p. ej. un estudiante) o contrasena pendiente de cambio
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NoEncontrado:
      description: No existe, el usuario no puede verlo o nunca se analizo
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflicto:
      description: Ya hay un analisis en curso o el estado del trabajo no lo permite
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            status: 409
            title: Conflicto
            detail: Ya hay un analisis de plagio en curso para este trabajo.
            instance: /api/v1/plagio/trabajos/7
            timestamp: '2026-11-17T14:00:00Z'
    ServicioNoDisponible:
      description: No se pudo verificar la sesion o el almacenamiento/proveedor no responde
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    EstadoAnalisis:
      type: string
      enum: [EN_PROCESO, COMPLETADO, ERROR]
    Motor:
      type: string
      enum: [SIMULADO, COPYLEAKS]
    TipoFuente:
      type: string
      enum: [INTERNA, INTERNET]

    Fuente:
      type: object
      required: [tipo, titulo, url, idTrabajo, porcentaje]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoFuente'
        titulo:
          type: string
          description: |
            Titulo de la fuente. Para una fuente INTERNA que no esta publicada (no EVALUADO) se devuelve el texto
            generico "Trabajo no publicado del repositorio interno" (no se revelan trabajos ajenos no publicados).
          example: Sistema de inventarios para PYMES
        url:
          type: string
          nullable: true
          description: Solo fuentes de internet.
        idTrabajo:
          type: integer
          format: int32
          nullable: true
          description: Solo fuentes INTERNA publicadas (EVALUADO), enlazable a /repositorio/{idTrabajo}; null en las no publicadas.
        porcentaje:
          type: number
          format: double
          minimum: 0
          maximum: 100
          example: 12.5
    Analisis:
      type: object
      required: [idAnalisis, idTrabajo, estado, motor, porcentajeSimilitud, nivel, umbralMedio, umbralAlto, comparacionInternet, fuentes, documentosAnalizados, mensajeError, iniciadoPor, fechaInicio, fechaFin]
      properties:
        idAnalisis:
          type: integer
          format: int32
        idTrabajo:
          type: integer
          format: int32
        estado:
          $ref: '#/components/schemas/EstadoAnalisis'
        motor:
          $ref: '#/components/schemas/Motor'
        porcentajeSimilitud:
          type: number
          format: double
          nullable: true
          description: Solo en COMPLETADO.
          example: 34.2
        nivel:
          type: string
          nullable: true
          enum: [OK, MEDIO, ALTO, null]
          description: Solo en COMPLETADO. Semaforo segun los umbrales de la facultad (verde, amarillo, rojo).
        umbralMedio:
          type: integer
          format: int32
          description: Umbrales usados al calcular el nivel (los vigentes al terminar).
          example: 30
        umbralAlto:
          type: integer
          format: int32
          example: 50
        comparacionInternet:
          type: boolean
        fuentes:
          type: array
          description: Ordenadas por porcentaje descendente (maximo PLAGIO_GROUP.MAX_FUENTES, por defecto 20).
          items:
            $ref: '#/components/schemas/Fuente'
        documentosAnalizados:
          type: integer
          format: int32
          example: 2
        mensajeError:
          type: string
          nullable: true
          description: Solo en ERROR; motivo legible (sin datos internos).
        iniciadoPor:
          type: string
          description: Nombre del docente que inicio el analisis.
        fechaInicio:
          type: string
          format: date-time
        fechaFin:
          type: string
          format: date-time
          nullable: true
    EstadoAnalisisResumen:
      type: object
      required: [idAnalisis, estado, porcentajeSimilitud, nivel]
      properties:
        idAnalisis:
          type: integer
          format: int32
        estado:
          $ref: '#/components/schemas/EstadoAnalisis'
        porcentajeSimilitud:
          type: number
          format: double
          nullable: true
        nivel:
          type: string
          nullable: true
          enum: [OK, MEDIO, ALTO, null]

    RespuestaAnalisis:
      type: object
      required: [data, message, status, timestamp]
      properties:
        data:
          $ref: '#/components/schemas/Analisis'
        message:
          type: string
        status:
          type: integer
          format: int32
        timestamp:
          type: string
          format: date-time
    RespuestaListaAnalisis:
      type: object
      required: [data, message, status, timestamp]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Analisis'
        message:
          type: string
        status:
          type: integer
          format: int32
        timestamp:
          type: string
          format: date-time
    RespuestaEstadoAnalisis:
      type: object
      required: [data, message, status, timestamp]
      properties:
        data:
          $ref: '#/components/schemas/EstadoAnalisisResumen'
        message:
          type: string
        status:
          type: integer
          format: int32
        timestamp:
          type: string
          format: date-time
    RespuestaSinDatos:
      type: object
      description: Operaciones sin resultado; data siempre es null.
      required: [data, message, status, timestamp]
      properties:
        data:
          type: object
          nullable: true
        message:
          type: string
        status:
          type: integer
          format: int32
        timestamp:
          type: string
          format: date-time

    ProblemDetail:
      type: object
      required: [status, title, timestamp]
      properties:
        type:
          type: string
        status:
          type: integer
          format: int32
        title:
          type: string
        detail:
          type: string
        instance:
          type: string
        timestamp:
          type: string
          format: date-time
        errores:
          type: object
          description: Solo en errores de validacion; campo -> mensaje.
          additionalProperties:
            type: string
