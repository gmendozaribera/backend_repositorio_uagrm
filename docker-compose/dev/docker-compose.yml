# Entorno de desarrollo.
#   Solo infraestructura:        docker compose up -d
#   Infraestructura + servicios: docker compose --profile services up -d --build
#     (antes: ./gradlew bootJar desde la raiz del repo)
name: repositorio-dev

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-repositorio}
      POSTGRES_USER: ${POSTGRES_USER:-repositorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repositorio}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_dev_password}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Docker Hub dejo de publicar minio/minio; se usa la build de Chainguard (sin shell ni mc)
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola web
    volumes:
      - minio-data:/data

  auth-service:
    profiles: ["services"]
    build:
      context: ../../source/ws/auth-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-repositorio}
      DB_USERNAME: ${POSTGRES_USER:-repositorio}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-repositorio}
      ADMIN_INICIAL_PASSWORD: ${ADMIN_INICIAL_PASSWORD:-Admin2026.}
      SPRING_PROFILES_ACTIVE: dev
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
    ports:
      - "8081:8081"
    # auth-service es el unico que aplica las migraciones Flyway: los demas servicios esperan a que este listo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  catalog-service:
    profiles: ["services"]
    build:
      context: ../../source/ws/catalog-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-repositorio}
      DB_USERNAME: ${POSTGRES_USER:-repositorio}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-repositorio}
      SPRING_PROFILES_ACTIVE: dev
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
    ports:
      - "8082:8082"
    depends_on:
      # ddl-auto=validate: necesita el esquema ya migrado por auth-service
      auth-service:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-service:
    profiles: ["services"]
    build:
      context: ../../source/ws/user-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-repositorio}
      DB_USERNAME: ${POSTGRES_USER:-repositorio}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-repositorio}
      SPRING_PROFILES_ACTIVE: dev
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
    ports:
      - "8083:8083"
    depends_on:
      # ddl-auto=validate: necesita el esquema ya migrado por auth-service
      auth-service:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Mock del contrato para desarrollo en paralelo: responde segun los ejemplos de auth-api.yaml
  # y rechaza requests que no cumplen el contrato.
  #   docker compose --profile mock up -d contrato-mock   ->  http://localhost:4010/api/v1/auth/login
  #   (catalog-api.yaml: contrato-mock-catalog en :4011; user-api.yaml: contrato-mock-user en :4012)
  # Header "Prefer: example=conDosFactores" elige un ejemplo; "Prefer: code=401" fuerza un error.
  contrato-mock:
    profiles: ["mock"]
    image: stoplight/prism:5.12.0   # la etiqueta "5" (latest) no arranca: bug isPrimary
    command: ["mock", "-h", "0.0.0.0", "/contratos/auth-api.yaml"]
    volumes:
      - ../../source/spec/src/main/resources/openapi:/contratos:ro
    ports:
      - "4010:4010"

  # Igual que contrato-mock, para catalog-api.yaml:  http://localhost:4011/api/v1/facultades
  contrato-mock-catalog:
    profiles: ["mock"]
    image: stoplight/prism:5.12.0
    command: ["mock", "-h", "0.0.0.0", "/contratos/catalog-api.yaml"]
    volumes:
      - ../../source/spec/src/main/resources/openapi:/contratos:ro
    ports:
      - "4011:4010"

  # Igual que contrato-mock, para user-api.yaml:  http://localhost:4012/api/v1/usuarios
  contrato-mock-user:
    profiles: ["mock"]
    image: stoplight/prism:5.12.0
    command: ["mock", "-h", "0.0.0.0", "/contratos/user-api.yaml"]
    volumes:
      - ../../source/spec/src/main/resources/openapi:/contratos:ro
    ports:
      - "4012:4010"

volumes:
  postgres-data:
  redis-data:
  minio-data:
