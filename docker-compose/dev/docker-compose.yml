# Entorno de desarrollo.
#   Solo infraestructura:        docker compose up -d
#   Infraestructura + servicios: docker compose --profile services up -d --build
#     (antes: ./gradlew bootJar desde la raiz del repo)
name: repositorio-dev

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-repositorio}
      POSTGRES_USER: ${POSTGRES_USER:-repositorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repositorio}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_dev_password}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Docker Hub dejo de publicar minio/minio; se usa la build de Chainguard (sin shell ni mc)
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola web
    volumes:
      - minio-data:/data

  auth-service:
    profiles: ["services"]
    build:
      context: ../../source/ws/auth-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-repositorio}
      DB_USERNAME: ${POSTGRES_USER:-repositorio}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-repositorio}
      ADMIN_INICIAL_PASSWORD: ${ADMIN_INICIAL_PASSWORD:-Admin2026.}
      SPRING_PROFILES_ACTIVE: dev
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
